name: Sidespeaker
options:
  bundleIdPrefix: com.sidespeaker
  deploymentTarget:
    iOS: "16.0"
targets:
  Sidespeaker:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../LICENSE
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sidespeaker
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        SidePort: 5000
        SidePrebufferMs: 30
        SideMaxBufferMs: 60
        SideBgPrebufferMs: 300
        SideBgMaxBufferMs: 450
        SideTimeoutMs: 3000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidespeaker.app
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
